# Grype vulnerability scanner configuration
# Suppress false positives for jackson-databind and other dependencies

ignore:
  # Spring4Shell - Fixed in Spring Boot 2.5.12/2.6.6, we're using 4.0.3
  - vulnerability: GHSA-36p3-wjmg-h94x
    package:
      name: spring-boot-starter-web
      type: java-archive
    reason: "False positive - Spring4Shell (CVE-2022-22965) fixed in 2.5.12/2.6.6, using 4.0.3"
  
  # jackson-databind vulnerabilities - all fixed in 2.21.1
  - vulnerability: GHSA-cjjf-94ff-43w7
